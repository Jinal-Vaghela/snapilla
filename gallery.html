<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery & Memories | Snapilla Studio</title>
    <meta name="description" content="Explore the Snapilla Studio photography moodboard wall. Handcrafted memories of Baby Shoots, Weddings, Modeling, Products, Portraits, and Special Moments.">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Caveat:wght@600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        @font-face {
            font-family: 'Nikumaru';
            src: url('nikumaru.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        :root {
            --primary-color: #FEAB45;
            --font-logo: 'Nikumaru', 'Baloo 2', cursive;
            --font-hand: 'Caveat', cursive;
            --font-body: 'Outfit', sans-serif;
            --wall-bg: #f4f3ee;
        }

        body {
            background-color: #edece6;
            color: #222222;
            font-family: var(--font-body);
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        /* Gallery Navbar */
        .gallery-nav {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(0, 0, 0, 0.08);
            padding: 15px 5%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
        }

        /* Exact Logo Styling Matching Main Page */
        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            flex-shrink: 0;
            text-decoration: none;
        }

        .logo-img {
            height: 55px;
            width: auto;
            object-fit: contain;
            filter: drop-shadow(0 3px 8px rgba(0,0,0,0.1));
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .logo-container:hover .logo-img {
            transform: scale(1.06) rotate(-2deg);
        }

        .logo-text-group {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 0px;
            flex-shrink: 0;
        }

        .logo-main {
            font-family: var(--font-logo);
            color: var(--primary-color) !important;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 800;
            font-size: 2.2rem;
            line-height: 1;
            margin: 0;
            -webkit-text-stroke: 1.8px #000;
            paint-order: stroke fill;
            text-shadow: 
                -1.5px -1.5px 0 #000,
                 1.5px -1.5px 0 #000,
                -1.5px  1.5px 0 #000,
                 1.5px  1.5px 0 #000,
                 0px    1.8px 0 #000,
                 0px   -1.8px 0 #000,
                 1.8px  0px   0 #000,
                -1.8px  0px   0 #000;
            filter: drop-shadow(0 0 1px #fff) drop-shadow(0 0 2.5px #fff);
        }

        .logo-sub {
            font-family: var(--font-body);
            color: #000 !important;
            text-transform: uppercase;
            font-size: 0.72rem;
            font-weight: 800;
            letter-spacing: 5px;
            text-align: center;
            margin-top: 2px;
        }

        .gallery-nav-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-gallery-action {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 0.85rem;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .btn-home {
            background: #f0eee6;
            color: #333;
            border: 1px solid #ddd;
        }

        .btn-home:hover {
            background: #e4e1d7;
            color: #000;
        }

        .btn-book {
            background: #111111;
            color: #ffffff;
            font-weight: 700;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        .btn-book:hover {
            background: var(--primary-color);
            color: #000;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(254, 171, 69, 0.4);
        }

        /* Hero / Header Intro */
        .gallery-header {
            text-align: center;
            padding: 45px 5% 25px 5%;
            background: linear-gradient(to bottom, #ffffff 0%, #f4f3ee 100%);
            border-bottom: 1px solid rgba(0, 0, 0, 0.04);
        }

        .gallery-header h1 {
            font-family: var(--font-logo);
            font-size: 2.8rem;
            color: #1a1a1a;
            margin: 0 0 10px 0;
            letter-spacing: -0.5px;
        }

        .gallery-header h1 span {
            color: var(--primary-color);
        }

        .gallery-header p {
            color: #666;
            font-size: 1.05rem;
            max-width: 650px;
            margin: 0 auto 25px auto;
            line-height: 1.5;
        }

        /* Filter Tabs */
        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            max-width: 1100px;
            margin: 0 auto 10px auto;
            padding: 0 15px;
        }

        .filter-btn {
            background: #ffffff;
            color: #555;
            border: 1.5px solid #e0ded6;
            padding: 9px 20px;
            border-radius: 30px;
            font-size: 0.88rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.03);
        }

        .filter-btn:hover {
            background: #fff8ef;
            color: #d97706;
            border-color: #FEAB45;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(254, 171, 69, 0.2);
        }

        .filter-btn.active {
            background: #111111;
            color: #ffffff;
            border-color: #111111;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
            transform: translateY(-2px);
        }

        /* ========================================================
           WHITE BRICK WALL MOODBOARD (MATCHING USER IMAGE)
        ======================================================== */
        .moodboard-container {
            max-width: 1420px;
            margin: 30px auto 80px auto;
            padding: 0 20px;
        }

        .white-brick-wall {
            position: relative;
            background-color: #f7f6f1;
            background-image: 
                radial-gradient(ellipse at 18% 12%, rgba(255,255,255,0.95) 0%, rgba(247,246,241,0.7) 45%, rgba(238,235,227,0.9) 100%),
                linear-gradient(rgba(215, 210, 200, 0.35) 1.5px, transparent 1.5px),
                linear-gradient(90deg, rgba(215, 210, 200, 0.28) 1.5px, transparent 1.5px);
            background-size: 100% 100%, 100% 60px, 160px 120px;
            border: 1px solid rgba(225, 220, 210, 0.9);
            border-radius: 18px;
            box-shadow: 
                0 30px 70px rgba(0, 0, 0, 0.08),
                0 6px 20px rgba(0, 0, 0, 0.04),
                inset 0 0 100px rgba(0, 0, 0, 0.02);
            padding: 85px 45px 95px 45px;
            min-height: 750px;
            overflow: hidden;
        }

        /* Sun-Dappled Botanical Leaf Shadows (Tree branch shadows on wall) */
        .botanical-shadow-overlay {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 2;
            opacity: 0.9;
        }

        .botanical-shadow-svg {
            width: 100%;
            height: 100%;
        }

        /* Decorative Botanical Twig & Dried Leaf Accents */
        .dried-branch-decor {
            position: absolute;
            pointer-events: none;
            z-index: 4;
            filter: drop-shadow(4px 10px 12px rgba(0,0,0,0.18));
            opacity: 0.95;
        }

        .branch-top-right {
            top: 40px;
            right: 35px;
            width: 160px;
            height: 280px;
            transform: rotate(8deg);
        }

        .leaf-bottom-left {
            bottom: 45px;
            left: 40px;
            width: 130px;
            height: 150px;
            transform: rotate(-15deg);
        }

        /* ========================================================
           POLAROID PHOTO CARDS & BLACK WIRE BINDER CLIPS
        ======================================================== */
        .pinboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
            gap: 60px 35px;
            position: relative;
            z-index: 5;
        }

        /* Polaroid Photo Card */
        .polaroid-card {
            background: #ffffff;
            border-radius: 2px;
            padding: 15px 15px 24px 15px;
            box-shadow: 
                0 20px 40px rgba(0, 0, 0, 0.12),
                0 6px 15px rgba(0, 0, 0, 0.06),
                0 1px 3px rgba(0, 0, 0, 0.05);
            position: relative;
            cursor: pointer;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.4s ease, z-index 0s;
            display: flex;
            flex-direction: column;
            user-select: none;
            border: 1px solid rgba(0, 0, 0, 0.04);
        }

        /* Natural Casual Tilts matching image */
        .polaroid-card:nth-child(6n+1) { transform: rotate(-3.5deg); }
        .polaroid-card:nth-child(6n+2) { transform: rotate(2.5deg); }
        .polaroid-card:nth-child(6n+3) { transform: rotate(-2deg); }
        .polaroid-card:nth-child(6n+4) { transform: rotate(3.8deg); }
        .polaroid-card:nth-child(6n+5) { transform: rotate(-4deg); }
        .polaroid-card:nth-child(6n+6) { transform: rotate(1.8deg); }

        .polaroid-card:hover {
            transform: scale(1.06) rotate(0deg) translateY(-10px) !important;
            box-shadow: 
                0 30px 60px rgba(0, 0, 0, 0.22),
                0 12px 25px rgba(0, 0, 0, 0.12);
            z-index: 50;
        }

        /* Black Wire Binder / Foldback Clip (Matching image) */
        .binder-clip {
            position: absolute;
            top: -26px;
            left: 50%;
            transform: translateX(-50%);
            width: 36px;
            height: 42px;
            z-index: 30;
            pointer-events: none;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
        }

        /* Black triangular clamp holding top edge */
        .clip-clamp {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 34px;
            height: 16px;
            background: linear-gradient(180deg, #333333 0%, #151515 70%, #050505 100%);
            border-radius: 2px 2px 0 0;
            box-shadow: inset 0 1px 1px rgba(255,255,255,0.4), 0 2px 4px rgba(0,0,0,0.4);
        }

        .clip-clamp::after {
            content: '';
            position: absolute;
            bottom: 2px;
            left: 3px;
            right: 3px;
            height: 2px;
            background: #000000;
        }

        /* Wire loop handles standing up */
        .clip-wire {
            position: absolute;
            top: 2px;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 26px;
            border: 2.2px solid #222222;
            border-bottom: none;
            border-radius: 10px 10px 0 0;
            box-shadow: 0 1px 2px rgba(0,0,0,0.25);
        }

        .clip-wire::before {
            content: '';
            position: absolute;
            top: -3px;
            left: 50%;
            transform: translateX(-50%);
            width: 7px;
            height: 7px;
            border: 2px solid #222222;
            border-radius: 50%;
            background: #ffffff;
        }

        /* Polaroid Photo Image Wrap */
        .polaroid-img-wrap {
            width: 100%;
            aspect-ratio: 1 / 1;
            overflow: hidden;
            background: #ecebe6;
            position: relative;
            border-radius: 1px;
            box-shadow: inset 0 0 6px rgba(0,0,0,0.1);
        }

        .polaroid-img-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.5s ease;
        }

        .polaroid-card:hover .polaroid-img-wrap img {
            transform: scale(1.05);
        }

        .polaroid-zoom-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
            color: #ffffff;
            font-size: 1.5rem;
        }

        .polaroid-card:hover .polaroid-zoom-overlay {
            opacity: 1;
        }

        /* Polaroid Caption Footer */
        .polaroid-caption {
            padding-top: 14px;
            text-align: center;
        }

        .polaroid-title {
            font-family: var(--font-hand);
            font-size: 1.5rem;
            color: #222222;
            line-height: 1.1;
            font-weight: 700;
        }

        .polaroid-category-tag {
            font-size: 0.72rem;
            font-weight: 700;
            color: #c2410c;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-top: 4px;
            display: block;
        }

        /* ========================================================
           MOODBOARD ACCENT CARDS & SWATCHES
        ======================================================== */
        .swatch-card {
            background: #ffffff;
            padding: 16px 14px 22px 14px;
            border-radius: 2px;
            box-shadow: 0 16px 35px rgba(0,0,0,0.1), 0 4px 10px rgba(0,0,0,0.05);
            position: relative;
            user-select: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.3s ease;
        }

        .swatch-card:hover {
            transform: scale(1.04) rotate(0deg) !important;
            z-index: 40;
        }

        .swatch-color-box {
            width: 100%;
            height: 180px;
            background: #e5e3dc;
            border-radius: 1px;
            margin-bottom: 12px;
            box-shadow: inset 0 0 4px rgba(0,0,0,0.08);
        }

        .swatch-label {
            font-family: var(--font-body);
            font-size: 0.85rem;
            font-weight: 700;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .memo-note {
            background: #fffde7;
            padding: 24px 20px;
            border-radius: 2px;
            box-shadow: 0 16px 35px rgba(0,0,0,0.1);
            position: relative;
            color: #333333;
            font-family: var(--font-hand);
            font-size: 1.45rem;
            line-height: 1.35;
            display: flex;
            flex-direction: column;
            justify-content: center;
            text-align: center;
            user-select: none;
            transition: transform 0.3s ease;
            border: 1px solid rgba(0,0,0,0.04);
        }

        .memo-note:hover {
            transform: scale(1.05) rotate(0deg) !important;
            z-index: 40;
        }

        .memo-note-kraft {
            background: #f4ebd9;
            color: #4a3419;
        }

        /* ========================================================
           LIGHTBOX MODAL
        ======================================================== */
        .lightbox-modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(15px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            padding: 20px;
        }

        .lightbox-modal.active {
            display: flex;
            animation: fadeIn 0.3s ease;
        }

        .lightbox-container {
            max-width: 900px;
            width: 100%;
            background: #181818;
            border: 2px solid #FEAB45;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 25px 60px rgba(0,0,0,0.8), 0 0 35px rgba(254,171,69,0.3);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .lightbox-close {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 2rem;
            color: #fff;
            cursor: pointer;
            z-index: 20;
            transition: color 0.2s;
        }

        .lightbox-close:hover {
            color: var(--primary-color);
        }

        .lightbox-img-wrap {
            width: 100%;
            max-height: 65vh;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .lightbox-img-wrap img {
            max-width: 100%;
            max-height: 65vh;
            object-fit: contain;
            display: block;
        }

        .lightbox-footer {
            padding: 20px 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #1c1c1c;
            border-top: 1px solid #2a2a2a;
        }

        .lightbox-info h3 {
            margin: 0 0 4px 0;
            font-size: 1.3rem;
            color: var(--primary-color);
            font-family: var(--font-logo);
        }

        .lightbox-info p {
            margin: 0;
            font-size: 0.88rem;
            color: #aaa;
        }

        /* ========================================================
           MOBILE RESPONSIVENESS
        ======================================================== */
        @media (max-width: 768px) {
            .gallery-nav {
                padding: 12px 4%;
            }
            .logo-img {
                height: 40px;
            }
            .logo-main {
                font-size: 1.5rem;
                -webkit-text-stroke: 1.2px #000;
            }
            .logo-sub {
                font-size: 0.55rem;
                letter-spacing: 3px;
            }
            .btn-gallery-action {
                padding: 8px 14px;
                font-size: 0.78rem;
            }
            .gallery-header h1 {
                font-size: 2.1rem;
            }
            .gallery-header p {
                font-size: 0.9rem;
            }
            .white-brick-wall {
                padding: 55px 15px 65px 15px;
                border-radius: 12px;
            }
            .pinboard-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 35px 12px;
            }
            .polaroid-card {
                padding: 10px 10px 16px 10px;
            }
            .polaroid-title {
                font-size: 1.15rem;
            }
            .polaroid-category-tag {
                font-size: 0.62rem;
            }
            .memo-note {
                font-size: 1.1rem;
                padding: 16px 12px;
            }
            .lightbox-footer {
                flex-direction: column;
                gap: 12px;
                text-align: center;
            }
            .lightbox-footer .btn-book {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <!-- Sticky Navigation -->
    <nav class="gallery-nav">
        <a href="index.html" class="logo-container">
            <img src="logo.png" alt="Snapilla Studio" class="logo-img">
            <div class="logo-text-group">
                <span class="logo-main">Snapilla</span>
                <span class="logo-sub">Studio</span>
            </div>
        </a>
        <div class="gallery-nav-actions">
            <a href="index.html" class="btn-gallery-action btn-home">
                <i class="fas fa-home"></i> Home
            </a>
            <a href="index.html#booking" class="btn-gallery-action btn-book">
                <i class="fas fa-calendar-alt"></i> Book Shoot
            </a>
        </div>
    </nav>

    <!-- Header & Category Switcher -->
    <header class="gallery-header">
        <h1>📸 Studio Memories & <span>Gallery Wall</span></h1>
        <p>A curated visual moodboard of authentic moments, editorial portraits, joyful baby smiles, and grand celebrations captured at Snapilla Studio.</p>

        <!-- Category Filter Bar -->
        <div class="filter-bar" id="galleryFilterBar">
            <button class="filter-btn active" data-filter="all"><i class="fas fa-th-large"></i> All Memories</button>
            <button class="filter-btn" data-filter="wedding"><i class="fas fa-ring"></i> Weddings</button>
            <button class="filter-btn" data-filter="baby"><i class="fas fa-baby"></i> Baby Shoots</button>
            <button class="filter-btn" data-filter="product"><i class="fas fa-shopping-bag"></i> Products</button>
            <button class="filter-btn" data-filter="modeling"><i class="fas fa-tshirt"></i> Modeling</button>
            <button class="filter-btn" data-filter="portrait"><i class="fas fa-user-tie"></i> Portraits</button>
            <button class="filter-btn" data-filter="family"><i class="fas fa-users"></i> Family</button>
            <button class="filter-btn" data-filter="birthday"><i class="fas fa-birthday-cake"></i> Birthdays</button>
            <button class="filter-btn" data-filter="couple"><i class="fas fa-heart"></i> Couple</button>
        </div>
    </header>

    <!-- Main White Brick Wall Moodboard (Matching Uploaded Image) -->
    <main class="moodboard-container">
        <div class="white-brick-wall">
            
            <!-- Sun-Dappled Tree Branch Shadows Overlay -->
            <div class="botanical-shadow-overlay" aria-hidden="true">
                <svg class="botanical-shadow-svg" viewBox="0 0 1400 800" preserveAspectRatio="none">
                    <defs>
                        <filter id="blurShadow" x="-20%" y="-20%" width="140%" height="140%">
                            <feGaussianBlur in="SourceGraphic" stdDeviation="12" />
                        </filter>
                    </defs>
                    <!-- Soft botanical leaf shadows across top left & top center -->
                    <g filter="url(#blurShadow)" fill="rgba(0, 0, 0, 0.05)">
                        <path d="M -50,-20 Q 80,120 220,90 Q 360,60 480,140 Q 300,180 180,240 Q 60,200 -50,150 Z" />
                        <path d="M 120,-30 Q 280,70 420,30 Q 560,0 700,80 Q 580,120 440,160 Q 280,140 120,60 Z" />
                        <path d="M 600,-40 Q 750,90 900,50 Q 1050,20 1180,90 Q 1020,130 880,150 Q 720,110 600,40 Z" />
                        <circle cx="260" cy="220" r="45" />
                        <circle cx="380" cy="260" r="35" />
                        <circle cx="520" cy="190" r="40" />
                    </g>
                </svg>
            </div>

            <!-- Pinned Polaroid Grid (Populated dynamically & with rich defaults) -->
            <div class="pinboard-grid" id="pinboardGrid">
                <!-- Injected via JavaScript -->
            </div>
        </div>
    </main>

    <!-- Interactive Lightbox Modal -->
    <div class="lightbox-modal" id="lightboxModal">
        <span class="lightbox-close" id="lightboxClose">&times;</span>
        <div class="lightbox-container">
            <div class="lightbox-img-wrap">
                <img src="" alt="Enlarged Photo" id="lightboxImg">
            </div>
            <div class="lightbox-footer">
                <div class="lightbox-info">
                    <h3 id="lightboxTitle">Photo Title</h3>
                    <p id="lightboxCategory">Category</p>
                </div>
                <a href="index.html#booking" class="btn-gallery-action btn-book">
                    <i class="fas fa-calendar-check"></i> Book This Shoot Experience
                </a>
            </div>
        </div>
    </div>

    <!-- Firebase SDK Scripts for Live Firestore Content Synchronization -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js?v=3.2"></script>

    <script>
        // Gallery Wall Master Dataset
        const DEFAULT_GALLERY_PHOTOS = [
            {
                id: 'p1',
                title: 'Grand Wedding Romance',
                category: 'wedding',
                categoryLabel: 'Wedding Shoot',
                image: 'wedding.png',
                caption: 'Forever begins in a single frame ✨'
            },
            {
                id: 'p2',
                title: 'Cozy Baby Dreams',
                category: 'baby',
                categoryLabel: 'Baby Shoot',
                image: 'baby.png',
                caption: 'Tiny hands, big dreams 👶'
            },
            {
                id: 'p3',
                title: 'High-Fashion Editorial',
                category: 'modeling',
                categoryLabel: 'Modeling Shoot',
                image: 'modeling.png',
                caption: 'Confidence looks good on camera 👗'
            },
            {
                id: 'p4',
                title: 'Commercial Product Visual',
                category: 'product',
                categoryLabel: 'Product Shoot',
                image: 'product.png',
                caption: 'Make your product unforgettable 🛍️'
            },
            {
                id: 'p5',
                title: 'Signature Studio Portrait',
                category: 'portrait',
                categoryLabel: 'Portraits',
                image: 'p1.png',
                caption: 'Mood, lighting & character 👔'
            },
            {
                id: 'p6',
                title: 'Timeless Family Bonds',
                category: 'family',
                categoryLabel: 'Family Shoot',
                image: 'p2.png',
                caption: 'Generations together in love 👨‍👩‍👧'
            },
            {
                id: 'p7',
                title: 'First Birthday Celebration',
                category: 'birthday',
                categoryLabel: 'Birthday Shoot',
                image: 'p3.png',
                caption: 'Cake smashes & joyful laughter 🎂'
            },
            {
                id: 'p8',
                title: 'Pre-Wedding Sunset Romance',
                category: 'wedding',
                categoryLabel: 'Wedding Shoot',
                image: 'p4.png',
                caption: 'Two hearts, one story ❤️'
            },
            {
                id: 'p9',
                title: 'Creative Studio Concept',
                category: 'couple',
                categoryLabel: 'Couple Shoot',
                image: 'wedding.png',
                caption: 'Artistic couple portraits ✨'
            },
            {
                id: 'p10',
                title: 'Little Milestone Smiles',
                category: 'baby',
                categoryLabel: 'Baby Shoot',
                image: 'baby.png',
                caption: 'Pure innocence captured 🍼'
            },
            {
                id: 'p11',
                title: 'Runway Casting Portfolio',
                category: 'modeling',
                categoryLabel: 'Modeling Shoot',
                image: 'modeling.png',
                caption: 'Editorial mood lighting 🌟'
            },
            {
                id: 'p12',
                title: 'Brand Amazon Showcase',
                category: 'product',
                categoryLabel: 'Product Shoot',
                image: 'product.png',
                caption: 'Crisp commercial brilliance 📸'
            }
        ];

        // Aesthetic Moodboard Swatches & Notes
        const MOODBOARD_EXTRAS = [
            {
                type: 'note',
                text: "✨ “In photography, there is a reality so subtle that it becomes more real than reality.”",
                author: "Snapilla Studio",
                colorClass: "memo-note-kraft",
                insertIndex: 3
            },
            {
                type: 'swatch',
                color: '#e5e2db',
                label: 'Natural Studio Beige',
                insertIndex: 7
            },
            {
                type: 'note',
                text: "📍 Dedicated Studio Sessions in Ahmedabad. Let's create your moodboard!",
                author: "Appointment Only",
                colorClass: "memo-note",
                insertIndex: 11
            }
        ];

        let currentPhotos = [...DEFAULT_GALLERY_PHOTOS];
        let currentFilter = 'all';

        // Initialize Gallery on Load
        document.addEventListener('DOMContentLoaded', () => {
            loadLivePhotos();
            checkUrlCategory();
            setupFilters();
            setupLightbox();
        });

        // Load Live Photos from Firestore or Local Cache
        function loadLivePhotos() {
            try {
                const stored = localStorage.getItem('snapilla_local_content');
                if (stored) {
                    const data = JSON.parse(stored);
                    if (data.portfolio && Array.isArray(data.portfolio) && data.portfolio.length > 0) {
                        currentPhotos = data.portfolio.map((item, idx) => ({
                            id: 'live_' + idx,
                            title: item.title || `Snapilla Memory ${idx + 1}`,
                            category: (item.category || item.title || '').toLowerCase().includes('wed') ? 'wedding' :
                                      (item.category || item.title || '').toLowerCase().includes('baby') ? 'baby' :
                                      (item.category || item.title || '').toLowerCase().includes('prod') ? 'product' :
                                      (item.category || item.title || '').toLowerCase().includes('model') ? 'modeling' :
                                      (item.category || item.title || '').toLowerCase().includes('port') ? 'portrait' :
                                      (item.category || item.title || '').toLowerCase().includes('fam') ? 'family' :
                                      (item.category || item.title || '').toLowerCase().includes('birth') ? 'birthday' : 'wedding',
                            categoryLabel: item.category || 'Studio Shoot',
                            image: item.image || 'p1.png',
                            caption: item.alt || 'Captured at Snapilla Studio ✨'
                        }));
                    }
                }
            } catch (e) {
                console.log('Using default gallery set');
            }
            renderPinboard();
        }

        // Check URL Query Param or Hash (e.g. gallery.html?category=wedding)
        function checkUrlCategory() {
            const params = new URLSearchParams(window.location.search);
            const rawCat = (params.get('category') || window.location.hash.replace('#', '') || '').toLowerCase().trim();
            if (!rawCat) return;

            let targetFilter = 'all';
            if (rawCat.includes('wed')) targetFilter = 'wedding';
            else if (rawCat.includes('bab')) targetFilter = 'baby';
            else if (rawCat.includes('prod')) targetFilter = 'product';
            else if (rawCat.includes('model')) targetFilter = 'modeling';
            else if (rawCat.includes('port')) targetFilter = 'portrait';
            else if (rawCat.includes('fam')) targetFilter = 'family';
            else if (rawCat.includes('birth')) targetFilter = 'birthday';
            else if (rawCat.includes('coupl')) targetFilter = 'couple';

            const matchBtn = document.querySelector(`.filter-btn[data-filter="${targetFilter}"]`);
            if (matchBtn) {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                matchBtn.classList.add('active');
                currentFilter = targetFilter;
            }
        }

        // Render Moodboard Wall
        function renderPinboard() {
            const grid = document.getElementById('pinboardGrid');
            grid.innerHTML = '';

            const filtered = currentFilter === 'all' 
                ? currentPhotos 
                : currentPhotos.filter(p => {
                    const pCat = (p.category || '').toLowerCase();
                    return pCat.includes(currentFilter) || currentFilter.includes(pCat);
                });

            let itemCounter = 0;

            filtered.forEach((photo, idx) => {
                // Check if we should insert a moodboard extra element
                const extra = MOODBOARD_EXTRAS.find(e => e.insertIndex === itemCounter);
                if (extra && currentFilter === 'all') {
                    if (extra.type === 'note') {
                        const noteEl = document.createElement('div');
                        noteEl.className = `memo-note ${extra.colorClass}`;
                        noteEl.style.transform = `rotate(${((itemCounter % 3) - 1) * 3}deg)`;
                        noteEl.innerHTML = `
                            <div class="binder-clip">
                                <div class="clip-wire"></div>
                                <div class="clip-clamp"></div>
                            </div>
                            <p>${extra.text}</p>
                            <span style="font-size: 0.9rem; color: #888; margin-top: 8px;">— ${extra.author}</span>
                        `;
                        grid.appendChild(noteEl);
                    } else if (extra.type === 'swatch') {
                        const swatchEl = document.createElement('div');
                        swatchEl.className = 'swatch-card';
                        swatchEl.style.transform = `rotate(${((itemCounter % 2) === 0 ? 3 : -3)}deg)`;
                        swatchEl.innerHTML = `
                            <div class="binder-clip">
                                <div class="clip-wire"></div>
                                <div class="clip-clamp"></div>
                            </div>
                            <div class="swatch-color-box" style="background: ${extra.color};"></div>
                            <div class="swatch-label">${extra.label}</div>
                        `;
                        grid.appendChild(swatchEl);
                    }
                }

                const card = document.createElement('div');
                card.className = 'polaroid-card';
                card.dataset.id = photo.id;
                card.innerHTML = `
                    <div class="binder-clip">
                        <div class="clip-wire"></div>
                        <div class="clip-clamp"></div>
                    </div>
                    <div class="polaroid-img-wrap">
                        <img src="${photo.image}" alt="${photo.title}" loading="lazy">
                        <div class="polaroid-zoom-overlay">
                            <i class="fas fa-search-plus"></i>
                        </div>
                    </div>
                    <div class="polaroid-caption">
                        <div class="polaroid-title">${photo.title}</div>
                        <span class="polaroid-category-tag">${photo.categoryLabel}</span>
                    </div>
                `;

                card.addEventListener('click', () => {
                    openLightbox(photo);
                });

                grid.appendChild(card);
                itemCounter++;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div style="grid-column: 1 / -1; text-align: center; padding: 60px 20px; color: #333;">
                        <p style="font-size: 1.5rem; font-family: var(--font-logo); color: #111;">No photos found in this category yet.</p>
                        <p style="color: #666;">Try switching categories above or viewing all memories.</p>
                    </div>
                `;
            }
        }

        // Filter Bar Event Listeners
        function setupFilters() {
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentFilter = btn.dataset.filter;
                    renderPinboard();
                });
            });
        }

        // Lightbox Handler
        function setupLightbox() {
            const modal = document.getElementById('lightboxModal');
            const closeBtn = document.getElementById('lightboxClose');

            closeBtn.addEventListener('click', () => {
                modal.classList.remove('active');
            });

            modal.addEventListener('click', (e) => {
                if (e.target === modal) {
                    modal.classList.remove('active');
                }
            });

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') modal.classList.remove('active');
            });
        }

        function openLightbox(photo) {
            const modal = document.getElementById('lightboxModal');
            document.getElementById('lightboxImg').src = photo.image;
            document.getElementById('lightboxTitle').textContent = photo.title;
            document.getElementById('lightboxCategory').textContent = `${photo.categoryLabel} • ${photo.caption}`;
            modal.classList.add('active');
        }
    </script>
</body>
