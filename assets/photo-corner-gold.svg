<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" fill="none">
  <!-- Soft gold gradient definitions -->
  <defs>
    <linearGradient id="photoGoldStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5D78E"/>
      <stop offset="35%" stop-color="#E5C178"/>
      <stop offset="70%" stop-color="#C69446"/>
      <stop offset="100%" stop-color="#DEB362"/>
    </linearGradient>
    <linearGradient id="photoGoldFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C178" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#C69446" stop-opacity="0.03"/>
    </linearGradient>
    <filter id="photoSoftGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#D4A359" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#photoSoftGlow)" stroke="url(#photoGoldStroke)" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- ==============================================
         1. 35mm FILM STRIP RIBBON (Curving through scene)
         ============================================== -->
    <!-- Film Strip Outer Ribbons -->
    <path d="M25 285 C45 220, 80 160, 135 115 C175 80, 235 55, 305 45" stroke-width="1.8" fill="url(#photoGoldFill)"/>
    <path d="M40 305 C62 238, 98 178, 155 132 C195 98, 255 72, 320 62" stroke-width="1.8"/>
    
    <!-- Film Sprocket Guide Lines -->
    <path d="M28 288 C48 223, 83 163, 138 118 C178 83, 238 58, 307 48" stroke-width="0.8" stroke-dasharray="1 3"/>
    <path d="M37 302 C59 235, 95 175, 152 129 C192 95, 252 69, 317 59" stroke-width="0.8" stroke-dasharray="1 3"/>

    <!-- Film Sprocket Holes -->
    <!-- Segment 1 -->
    <rect x="36" y="278" width="5" height="7" rx="1.2" transform="rotate(-65 36 278)" stroke-width="1.2" fill="#E5C178" fill-opacity="0.15"/>
    <rect x="47" y="254" width="5" height="7" rx="1.2" transform="rotate(-58 47 254)" stroke-width="1.2" fill="#E5C178" fill-opacity="0.15"/>
    <rect x="60" y="230" width="5" height="7" rx="1.2" transform="rotate(-50 60 230)" stroke-width="1.2" fill="#E5C178" fill-opacity="0.15"/>
    <rect x="76" y="206" width="5" height="7" rx="1.2" transform="rotate(-43 76 206)" stroke-width="1.2" fill="#E5C178" fill-opacity="0.15"/>
    <rect x="94" y="184" width="5" height="7" rx="1.2" transform="rotate(-36 94 184)" stroke-width="1.2" fill="#E5C178" fill-opacity="0.15"/>
    <rect x="115" y="163" width="5" height="7" rx="1.2" transform="rotate(-30 115 163)" stroke-width="1.2" fill="#E5C178" fill-opacity="0.15"/>
    <rect x="138" y="144" width="5" height="7" rx="1.2" transform="rotate(-24 138 144)" stroke-width="1.2" fill="#E5C178" fill-opacity="0.15"/>
    <rect x="165" y="126" width="5" height="7" rx="1.2" transform="rotate(-18 165 126)" stroke-width="1.2" fill="#E5C178" fill-opacity="0.15"/>
    <rect x="195" y="110" width="5" height="7" rx="1.2" transform="rotate(-14 195 110)" stroke-width="1.2" fill="#E5C178" fill-opacity="0.15"/>
    <rect x="228" y="96" width="5" height="7" rx="1.2" transform="rotate(-10 228 96)" stroke-width="1.2" fill="#E5C178" fill-opacity="0.15"/>
    <rect x="262" y="84" width="5" height="7" rx="1.2" transform="rotate(-6 262 84)" stroke-width="1.2" fill="#E5C178" fill-opacity="0.15"/>

    <!-- Film Frame Dividers & Numbering -->
    <path d="M52 268 L68 284" stroke-width="1.2"/>
    <path d="M88 220 L106 238" stroke-width="1.2"/>
    <path d="M128 174 L148 194" stroke-width="1.2"/>
    <path d="M174 134 L196 154" stroke-width="1.2"/>
    <path d="M225 100 L248 120" stroke-width="1.2"/>

    <!-- Film Frame Info Text Markings -->
    <text x="68" y="272" font-family="'Cinzel', 'Playfair Display', serif" font-size="6" fill="#C69446" stroke="none" transform="rotate(-48 68 272)" letter-spacing="1">35mm • 400</text>
    <text x="145" y="180" font-family="'Cinzel', 'Playfair Display', serif" font-size="6" fill="#C69446" stroke="none" transform="rotate(-28 145 180)" letter-spacing="1">EXP 24A</text>
    <text x="242" y="112" font-family="'Cinzel', 'Playfair Display', serif" font-size="6" fill="#C69446" stroke="none" transform="rotate(-12 242 112)" letter-spacing="1">SNAPILLA</text>


    <!-- ==============================================
         2. CENTRAL RANGEFINDER CAMERA & LENS (Luxury Line-Art)
         ============================================== -->
    <!-- Camera Body Silhouette -->
    <rect x="135" y="165" width="125" height="85" rx="10" stroke-width="2" fill="#FFFFFF" fill-opacity="0.04"/>
    
    <!-- Camera Top Plate / Prism Housing -->
    <path d="M150 165 L150 152 C150 148, 154 145, 158 145 L202 145 C206 145, 210 148, 210 152 L210 165" stroke-width="1.8" fill="url(#photoGoldFill)"/>
    <path d="M170 145 L170 138 C170 135, 172 133, 175 133 L188 133 C191 133, 193 135, 193 138 L193 145" stroke-width="1.5"/>
    
    <!-- Hotshoe & Dials -->
    <rect x="172" y="130" width="18" height="3" rx="1" stroke-width="1.2"/>
    <rect x="220" y="156" width="16" height="9" rx="2" stroke-width="1.5"/>
    <circle cx="240" cy="158" r="4" stroke-width="1.4"/>
    <circle cx="145" cy="158" r="5" stroke-width="1.4"/>
    
    <!-- Viewfinder Window & Red Dot Style Accent -->
    <rect x="148" y="174" width="16" height="12" rx="2" stroke-width="1.4"/>
    <circle cx="156" cy="180" r="3" stroke-width="1"/>
    <circle cx="238" cy="180" r="4" stroke-width="1.2" fill="#E5C178" fill-opacity="0.25"/>

    <!-- Camera Grip & Accent Lines -->
    <path d="M246 172 L246 242" stroke-width="1.2" stroke-dasharray="3 3"/>
    <path d="M142 225 L142 245" stroke-width="1.2"/>
    <path d="M142 245 L252 245" stroke-width="1.5"/>

    <!-- Concentric Lens Barrel -->
    <circle cx="198" cy="210" r="44" stroke-width="2" fill="#FFFFFF" fill-opacity="0.05"/>
    <circle cx="198" cy="210" r="38" stroke-width="1.2" stroke-dasharray="6 3"/>
    <circle cx="198" cy="210" r="32" stroke-width="1.8"/>
    <circle cx="198" cy="210" r="25" stroke-width="1.2"/>
    <circle cx="198" cy="210" r="16" stroke-width="1.5" fill="url(#photoGoldFill)"/>
    <circle cx="198" cy="210" r="8" stroke-width="1.8"/>
    <circle cx="198" cy="210" r="2.5" fill="#E5C178" stroke="none"/>

    <!-- 8 Aperture Diaphragm Blades -->
    <path d="M198 194 L212 204" stroke-width="1.3"/>
    <path d="M214 200 L214 218" stroke-width="1.3"/>
    <path d="M212 216 L198 226" stroke-width="1.3"/>
    <path d="M202 226 L186 222" stroke-width="1.3"/>
    <path d="M186 222 L182 206" stroke-width="1.3"/>
    <path d="M182 206 L194 196" stroke-width="1.3"/>
    
    <!-- Lens Optical Reflection Arcs -->
    <path d="M178 188 C186 180, 206 180, 218 190" stroke-width="1.5"/>
    <path d="M182 228 C192 234, 208 232, 218 224" stroke-width="1"/>
    
    <!-- Lens Engraving Text -->
    <text x="180" y="174" font-family="'Cinzel', serif" font-size="4.5" fill="#E5C178" stroke="none" letter-spacing="1.2">F/1.2 • 50MM</text>


    <!-- ==============================================
         3. VIEWFINDER HUD & FOCUS RETICLES
         ============================================== -->
    <!-- Large Viewfinder Framing Brackets -->
    <!-- Top-Left -->
    <path d="M20 50 L20 20 L50 20" stroke-width="2"/>
    <!-- Top-Right -->
    <path d="M270 20 L300 20 L300 50" stroke-width="2"/>
    <!-- Bottom-Left -->
    <path d="M20 270 L20 300 L50 300" stroke-width="2"/>
    <!-- Bottom-Right -->
    <path d="M270 300 L300 300 L300 270" stroke-width="2"/>

    <!-- Viewfinder Center Crosshair Reticle -->
    <path d="M68 68 L68 56 M68 68 L68 80 M68 68 L56 68 M68 68 L80 68" stroke-width="1.4"/>
    <circle cx="68" cy="68" r="10" stroke-width="1" stroke-dasharray="2 3"/>
    <circle cx="68" cy="68" r="2" fill="#E5C178" stroke="none"/>

    <!-- Rule of Thirds Guide Lines (Delicate) -->
    <line x1="20" y1="100" x2="300" y2="100" stroke-width="0.6" stroke-dasharray="4 6" opacity="0.4"/>
    <line x1="100" y1="20" x2="100" y2="300" stroke-width="0.6" stroke-dasharray="4 6" opacity="0.4"/>

    <!-- Studio Optical Metadata HUD Tags -->
    <text x="24" y="38" font-family="'Cinzel', monospace" font-size="7" fill="#E5C178" stroke="none" font-weight="bold" letter-spacing="1">[ 4K PRO ]</text>
    <text x="24" y="118" font-family="monospace" font-size="6" fill="#C69446" stroke="none">ISO 100</text>
    <text x="24" y="130" font-family="monospace" font-size="6" fill="#C69446" stroke="none">1/500s</text>
    <text x="24" y="142" font-family="monospace" font-size="6" fill="#C69446" stroke="none">EV +0.0</text>


    <!-- ==============================================
         4. CINEMATIC LIGHT / OPTICAL FLARES & STARS
         ============================================== -->
    <!-- Primary 8-Point Lens Flare Burst -->
    <g transform="translate(75, 45)">
      <path d="M0 -16 L0 16 M-16 0 L16 0" stroke-width="1.5"/>
      <path d="M-10 -10 L10 10 M-10 10 L10 -10" stroke-width="0.9"/>
      <circle cx="0" cy="0" r="3" fill="#E5C178" fill-opacity="0.6" stroke="none"/>
    </g>

    <!-- Secondary Star Sparkles -->
    <g transform="translate(285, 140)">
      <path d="M0 -10 L0 10 M-10 0 L10 0" stroke-width="1.2"/>
      <path d="M-6 -6 L6 6 M-6 6 L6 -6" stroke-width="0.7"/>
      <circle cx="0" cy="0" r="2" fill="#E5C178" stroke="none"/>
    </g>

    <g transform="translate(110, 275)">
      <path d="M0 -8 L0 8 M-8 0 L8 0" stroke-width="1.2"/>
      <circle cx="0" cy="0" r="1.8" fill="#E5C178" stroke="none"/>
    </g>

    <g transform="translate(275, 245)">
      <path d="M0 -11 L0 11 M-11 0 L11 0" stroke-width="1.3"/>
      <path d="M-7 -7 L7 7 M-7 7 L7 -7" stroke-width="0.8"/>
      <circle cx="0" cy="0" r="2.2" fill="#E5C178" stroke="none"/>
    </g>

    <g transform="translate(225, 30)">
      <path d="M0 -7 L0 7 M-7 0 L7 0" stroke-width="1.1"/>
      <circle cx="0" cy="0" r="1.5" fill="#E5C178" stroke="none"/>
    </g>

    <!-- Subtle Optical Bokeh Discs / Stipple Particles -->
    <circle cx="48" cy="95" r="2.5" stroke-width="0.8" fill="#E5C178" fill-opacity="0.2"/>
    <circle cx="92" cy="30" r="1.8" stroke-width="0.8" fill="#E5C178" fill-opacity="0.25"/>
    <circle cx="120" cy="85" r="3" stroke-width="0.8" fill="#E5C178" fill-opacity="0.15"/>
    <circle cx="160" cy="40" r="1.5" stroke-width="0.8" fill="#E5C178" fill-opacity="0.3"/>
    <circle cx="265" cy="185" r="2.5" stroke-width="0.8" fill="#E5C178" fill-opacity="0.2"/>
    <circle cx="280" cy="80" r="1.8" stroke-width="0.8" fill="#E5C178" fill-opacity="0.25"/>
    <circle cx="55" cy="160" r="2" stroke-width="0.8" fill="#E5C178" fill-opacity="0.2"/>
    <circle cx="85" cy="305" r="2" stroke-width="0.8" fill="#E5C178" fill-opacity="0.2"/>

  </g>
</svg>
