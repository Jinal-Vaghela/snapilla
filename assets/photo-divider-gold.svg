<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 50" fill="none">
  <!-- Gradient definitions -->
  <defs>
    <linearGradient id="divGoldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E5C178" stop-opacity="0"/>
      <stop offset="18%" stop-color="#DEB362" stop-opacity="0.5"/>
      <stop offset="35%" stop-color="#F5D78E"/>
      <stop offset="50%" stop-color="#C69446"/>
      <stop offset="65%" stop-color="#F5D78E"/>
      <stop offset="82%" stop-color="#DEB362" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#E5C178" stop-opacity="0"/>
    </linearGradient>
    <filter id="divGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#D4A359" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#divGlow)" stroke="url(#divGoldGrad)" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- Outer Tapered Divider Rule Lines -->
    <path d="M10 25 L145 25" stroke-width="1.2"/>
    <path d="M255 25 L390 25" stroke-width="1.2"/>
    
    <!-- Secondary Parallel Micro Guide Lines -->
    <path d="M40 22 L130 22" stroke-width="0.6" stroke-dasharray="2 4"/>
    <path d="M270 22 L360 22" stroke-width="0.6" stroke-dasharray="2 4"/>
    <path d="M40 28 L130 28" stroke-width="0.6" stroke-dasharray="2 4"/>
    <path d="M270 28 L360 28" stroke-width="0.6" stroke-dasharray="2 4"/>

    <!-- Optical Focus Distance Tick Marks (Left) -->
    <line x1="70" y1="18" x2="70" y2="32" stroke-width="1"/>
    <line x1="85" y1="20" x2="85" y2="30" stroke-width="0.8"/>
    <line x1="100" y1="18" x2="100" y2="32" stroke-width="1"/>
    <line x1="115" y1="20" x2="115" y2="30" stroke-width="0.8"/>
    <line x1="130" y1="17" x2="130" y2="33" stroke-width="1.2"/>

    <!-- Optical Focus Distance Tick Marks (Right) -->
    <line x1="270" y1="17" x2="270" y2="33" stroke-width="1.2"/>
    <line x1="285" y1="20" x2="285" y2="30" stroke-width="0.8"/>
    <line x1="300" y1="18" x2="300" y2="32" stroke-width="1"/>
    <line x1="315" y1="20" x2="315" y2="30" stroke-width="0.8"/>
    <line x1="330" y1="18" x2="330" y2="32" stroke-width="1"/>

    <!-- Left 35mm Mini Film Negative Segment -->
    <rect x="145" y="16" width="18" height="18" rx="2" stroke-width="1.2" fill="#E5C178" fill-opacity="0.08"/>
    <rect x="147" y="19" width="14" height="12" rx="1" stroke-width="0.8"/>
    <circle cx="149" cy="17" r="0.6" fill="#E5C178"/>
    <circle cx="159" cy="17" r="0.6" fill="#E5C178"/>
    <circle cx="149" cy="33" r="0.6" fill="#E5C178"/>
    <circle cx="159" cy="33" r="0.6" fill="#E5C178"/>

    <!-- Right 35mm Mini Film Negative Segment -->
    <rect x="237" y="16" width="18" height="18" rx="2" stroke-width="1.2" fill="#E5C178" fill-opacity="0.08"/>
    <rect x="239" y="19" width="14" height="12" rx="1" stroke-width="0.8"/>
    <circle cx="241" cy="17" r="0.6" fill="#E5C178"/>
    <circle cx="251" cy="17" r="0.6" fill="#E5C178"/>
    <circle cx="241" cy="33" r="0.6" fill="#E5C178"/>
    <circle cx="251" cy="33" r="0.6" fill="#E5C178"/>

    <!-- Viewfinder Brackets flanking Center -->
    <path d="M172 17 L168 17 L168 33 L172 33" stroke-width="1.2"/>
    <path d="M228 17 L232 17 L232 33 L228 33" stroke-width="1.2"/>

    <!-- CENTER LUXURY CAMERA APERTURE & LENS EMBLEM -->
    <circle cx="200" cy="25" r="18" stroke-width="1.5" fill="#FFFFFF" fill-opacity="0.05"/>
    <circle cx="200" cy="25" r="15" stroke-width="0.9" stroke-dasharray="3 2"/>
    <circle cx="200" cy="25" r="12" stroke-width="1.4" fill="#E5C178" fill-opacity="0.12"/>
    <circle cx="200" cy="25" r="6" stroke-width="1.5"/>
    <circle cx="200" cy="25" r="2" fill="#E5C178" stroke="none"/>

    <!-- Center Aperture Blades (6 Blades) -->
    <path d="M200 13 L207 20" stroke-width="1.1"/>
    <path d="M211 20 L208 29" stroke-width="1.1"/>
    <path d="M208 29 L198 31" stroke-width="1.1"/>
    <path d="M198 31 L191 25" stroke-width="1.1"/>
    <path d="M191 25 L194 16" stroke-width="1.1"/>
    <path d="M194 16 L202 13" stroke-width="1.1"/>

    <!-- Sparkling Optical Flare Stars -->
    <!-- Left Star -->
    <g transform="translate(50, 25)">
      <path d="M0 -7 L0 7 M-7 0 L7 0" stroke-width="1.2"/>
      <path d="M-4 -4 L4 4 M-4 4 L4 -4" stroke-width="0.7"/>
      <circle cx="0" cy="0" r="1.5" fill="#E5C178" stroke="none"/>
    </g>

    <!-- Right Star -->
    <g transform="translate(350, 25)">
      <path d="M0 -7 L0 7 M-7 0 L7 0" stroke-width="1.2"/>
      <path d="M-4 -4 L4 4 M-4 4 L4 -4" stroke-width="0.7"/>
      <circle cx="0" cy="0" r="1.5" fill="#E5C178" stroke="none"/>
    </g>

    <!-- Micro Star Accents -->
    <circle cx="25" cy="25" r="1.5" fill="#E5C178" stroke="none"/>
    <circle cx="375" cy="25" r="1.5" fill="#E5C178" stroke="none"/>
    <circle cx="178" cy="25" r="1.2" fill="#E5C178" stroke="none"/>
    <circle cx="222" cy="25" r="1.2" fill="#E5C178" stroke="none"/>

  </g>
</svg>
