<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" fill="none">
  <!-- Soft gold gradient definitions -->
  <defs>
    <linearGradient id="frameGoldStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5D78E"/>
      <stop offset="40%" stop-color="#E5C178"/>
      <stop offset="70%" stop-color="#C69446"/>
      <stop offset="100%" stop-color="#DEB362"/>
    </linearGradient>
    <filter id="frameSoftGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#D4A359" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g filter="url(#frameSoftGlow)" stroke="url(#frameGoldStroke)" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- Outer Viewfinder Framing Border -->
    <rect x="15" y="15" width="270" height="370" rx="6" stroke-width="1.2" stroke-dasharray="8 6"/>
    
    <!-- Solid Inner Frame -->
    <rect x="24" y="24" width="252" height="352" rx="4" stroke-width="1.8"/>

    <!-- Top-Left Corner Viewfinder HUD Crosshair & Brackets -->
    <path d="M10 35 L10 10 L35 10" stroke-width="2.2"/>
    <circle cx="24" cy="24" r="5" stroke-width="1" fill="#E5C178" fill-opacity="0.2"/>
    <circle cx="24" cy="24" r="1.5" fill="#E5C178" stroke="none"/>
    <text x="40" y="20" font-family="'Cinzel', monospace" font-size="6" fill="#C69446" stroke="none">[REC]</text>

    <!-- Top-Right Corner Viewfinder HUD Brackets -->
    <path d="M265 10 L290 10 L290 35" stroke-width="2.2"/>
    <circle cx="276" cy="24" r="5" stroke-width="1" fill="#E5C178" fill-opacity="0.2"/>
    <circle cx="276" cy="24" r="1.5" fill="#E5C178" stroke="none"/>
    <text x="235" y="20" font-family="'Cinzel', monospace" font-size="6" fill="#C69446" stroke="none">4K 60P</text>

    <!-- Bottom-Left Corner Viewfinder HUD Brackets -->
    <path d="M10 365 L10 390 L35 390" stroke-width="2.2"/>
    <circle cx="24" cy="376" r="5" stroke-width="1" fill="#E5C178" fill-opacity="0.2"/>
    <circle cx="24" cy="376" r="1.5" fill="#E5C178" stroke="none"/>
    <text x="40" y="386" font-family="'Cinzel', monospace" font-size="6" fill="#C69446" stroke="none">ISO 100</text>

    <!-- Bottom-Right Corner Viewfinder HUD Brackets & Lens Icon -->
    <path d="M265 390 L290 390 L290 365" stroke-width="2.2"/>
    <circle cx="276" cy="376" r="5" stroke-width="1" fill="#E5C178" fill-opacity="0.2"/>
    <circle cx="276" cy="376" r="1.5" fill="#E5C178" stroke="none"/>
    <text x="230" y="386" font-family="'Cinzel', monospace" font-size="6" fill="#C69446" stroke="none">F/1.4 50MM</text>

    <!-- Center Viewfinder Reticle Target -->
    <path d="M150 190 L150 210 M140 200 L160 200" stroke-width="1.2"/>
    <circle cx="150" cy="200" r="16" stroke-width="1" stroke-dasharray="4 3"/>
    <circle cx="150" cy="200" r="4" stroke-width="1.2"/>

    <!-- Optical Lens Flare Star -->
    <g transform="translate(150, 40)">
      <path d="M0 -6 L0 6 M-6 0 L6 0" stroke-width="1.2"/>
      <circle cx="0" cy="0" r="1.5" fill="#E5C178" stroke="none"/>
    </g>

  </g>
</svg>
